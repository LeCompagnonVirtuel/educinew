[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[auth]
enabled = true
site_url = "https://www.educi.live/verification"
additional_redirect_urls = ["https://www.educi.live", "https://educi.live", "http://localhost:3001", "https://www.educi.live/reset-password", "https://www.educi.live/verification", "https://www.educi.live/verification#token="]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.mfa]
max_enrolled_factors = 0

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[auth.mfa.web_authn]
enroll_enabled = false
verify_enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

[realtime]
enabled = true

[functions.ai-chat]
verify_jwt = true

[functions.ai-explain]
verify_jwt = true

[functions.ai-quiz]
verify_jwt = true

[functions.ai-summarize]
verify_jwt = true

[functions.import-template]
verify_jwt = true

[functions.payment-initiate]
verify_jwt = true

[functions.send-email]
verify_jwt = true

[functions.payment-webhook]
verify_jwt = false

[functions.generate-pdf]
verify_jwt = true

[functions.generate-qr]
verify_jwt = true
